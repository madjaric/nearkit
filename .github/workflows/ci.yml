name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Node 24 matches the Vercel build image.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit and integration tests
        run: npm test

      # The same configuration as the public testnet beta on Vercel, plus a canary:
      # only NearKit's own variables may be compiled into the bundle.
      - name: Production build
        run: npm run build
        env:
          VITE_NEARKIT_SERVICES: near
          VITE_NEAR_NETWORK: testnet
          VITE_ENABLE_MAINNET_EXECUTION: 'false'
          VITE_BUILD_CANARY: must-not-ship

      - name: No stray build variables in the bundle
        run: '! grep -rq must-not-ship dist/assets'
