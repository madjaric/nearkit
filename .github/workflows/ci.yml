name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Node 24 matches the Vercel build image.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit and integration tests
        run: npm test

      # The same configuration as the public testnet beta on Vercel, plus a canary:
      # only NearKit's own variables may be compiled into the bundle.
      - name: Production build
        run: npm run build
        env:
          VITE_NEARKIT_SERVICES: near
          VITE_NEAR_NETWORK: testnet
          VITE_ENABLE_MAINNET_EXECUTION: 'false'
          VITE_BUILD_CANARY: must-not-ship

      - name: No stray build variables in the bundle
        run: '! grep -rq must-not-ship dist/assets'

      # nearkits.com itself: mainnet, execution on, the production fee account. A setting that
      # breaks only the mainnet bundle fails here, not on Vercel.
      - name: Production build (mainnet, as on nearkits.com)
        run: npm run build
        env:
          VITE_NEARKIT_SERVICES: near
          VITE_NEAR_NETWORK: mainnet
          VITE_ENABLE_MAINNET_EXECUTION: 'true'
          VITE_NEARKIT_FEE_RECIPIENT: nearkitfee.near
          VITE_NEARKIT_API_URL: https://srv2021581.hstgr.cloud
          VITE_BUILD_CANARY: must-not-ship

      - name: No stray build variables in the mainnet bundle
        run: '! grep -rq must-not-ship dist/assets'

      # The Telegram bot server shares the web app's source; it must bundle too.
      - name: Server build
        run: npm run server:build

  postgres:
    # Production runs several server instances on one PostgreSQL. These suites run the
    # database layer, the leases and the multi-instance races (two connection pools
    # racing for the same intent) on a real server, plus the whole bot on Postgres SQL.
    name: Server on PostgreSQL (multi-instance races)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The version production runs (deploy/vps/docker-compose.yml).
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nearkit
          # A throwaway database inside the CI job; not a secret.
          POSTGRES_PASSWORD: nearkit_ci
          POSTGRES_DB: nearkit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nearkit -d nearkit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Database, leases and concurrency on SQLite, PGlite and PostgreSQL
        run: npx vitest run server/src/db server/src/custody server/src/signer server/src/referrals server/src/volumebot
        env:
          NEARKIT_TEST_DATABASE_URL: postgres://nearkit:nearkit_ci@127.0.0.1:5432/nearkit_test
      - name: The whole bot and the bridge on the Postgres dialect (PGlite)
        run: npx vitest run server/src/bot server/src/bridge --testTimeout=180000
        env:
          NEARKIT_TEST_BOT_DB: pglite
